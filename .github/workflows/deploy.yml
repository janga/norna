name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Restore generated image cache
        uses: actions/cache@v6
        with:
          path: |
            site/.norna/public/images/generated
            examples/**/site/.norna/public/images/generated
          key: norna-pages-images-v2-${{ hashFiles('site/pages/**/images/**', 'examples/**/site/pages/**/images/**') }}
          restore-keys: |
            norna-pages-images-v2-

      - name: Install dependencies
        run: npm ci

      - name: Build documentation and rendered examples
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
