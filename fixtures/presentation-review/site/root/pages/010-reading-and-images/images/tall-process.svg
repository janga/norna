<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 58 604 1324" role="img" aria-labelledby="title desc">
  <title id="title">Five-stage process diagram</title>
  <desc id="desc">Five numbered stages connected by a vertical line.</desc>
  <rect x="64" y="64" width="592" height="1312" rx="20" fill="#ffffff" stroke="#343a40" stroke-width="4"/>
  <text x="112" y="136" fill="#202428" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Generic process</text>
  <text x="112" y="178" fill="#596168" font-family="system-ui, sans-serif" font-size="20">A tall explanatory figure</text>
  <path d="M160 300V1160" stroke="#7f8c86" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(0 250)">
      <circle cx="160" cy="50" r="42" fill="#245f58"/>
      <text x="160" y="61" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text>
      <rect x="236" y="0" width="340" height="100" rx="10" fill="#e1ece8" stroke="#245f58" stroke-width="3"/>
      <text x="264" y="43" fill="#183d39" font-size="24" font-weight="700">Collect</text>
      <text x="264" y="73" fill="#365a55" font-size="18">Gather source material</text>
    </g>
    <g transform="translate(0 465)">
      <circle cx="160" cy="50" r="42" fill="#365f7d"/>
      <text x="160" y="61" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text>
      <rect x="236" y="0" width="340" height="100" rx="10" fill="#e3ecf3" stroke="#365f7d" stroke-width="3"/>
      <text x="264" y="43" fill="#223e53" font-size="24" font-weight="700">Organize</text>
      <text x="264" y="73" fill="#466276" font-size="18">Establish relationships</text>
    </g>
    <g transform="translate(0 680)">
      <circle cx="160" cy="50" r="42" fill="#745a2d"/>
      <text x="160" y="61" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text>
      <rect x="236" y="0" width="340" height="100" rx="10" fill="#f2ead8" stroke="#745a2d" stroke-width="3"/>
      <text x="264" y="43" fill="#4f3c1e" font-size="24" font-weight="700">Review</text>
      <text x="264" y="73" fill="#67583c" font-size="18">Check the complete result</text>
    </g>
    <g transform="translate(0 895)">
      <circle cx="160" cy="50" r="42" fill="#76506f"/>
      <text x="160" y="61" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">4</text>
      <rect x="236" y="0" width="340" height="100" rx="10" fill="#f0e5ee" stroke="#76506f" stroke-width="3"/>
      <text x="264" y="43" fill="#4d3449" font-size="24" font-weight="700">Refine</text>
      <text x="264" y="73" fill="#674f62" font-size="18">Resolve observed issues</text>
    </g>
    <g transform="translate(0 1110)">
      <circle cx="160" cy="50" r="42" fill="#485d32"/>
      <text x="160" y="61" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">5</text>
      <rect x="236" y="0" width="340" height="100" rx="10" fill="#e8eddf" stroke="#485d32" stroke-width="3"/>
      <text x="264" y="43" fill="#304020" font-size="24" font-weight="700">Publish</text>
      <text x="264" y="73" fill="#52613f" font-size="18">Share a stable outcome</text>
    </g>
  </g>
</svg>
