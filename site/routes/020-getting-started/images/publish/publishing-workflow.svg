<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Norna publishing workflow</title>
  <desc id="desc">Commit the site and push to GitHub. The included GitHub workflow automatically checks, builds and publishes the site to GitHub Pages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#b89f48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#64747c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(35 90)">
      <rect width="155" height="90" rx="12" fill="#d8c47a"/>
      <text x="77.5" y="55" text-anchor="middle" fill="#101417" font-size="22" font-weight="700">Commit</text>
    </g>
    <path d="M205 135h53" stroke="#b89f48" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(274 90)">
      <rect width="180" height="90" rx="12" fill="#182126" stroke="#52626b" stroke-width="2"/>
      <text x="90" y="45" text-anchor="middle" fill="#f2eee6" font-size="21" font-weight="700">Push to</text>
      <text x="90" y="69" text-anchor="middle" fill="#f2eee6" font-size="21" font-weight="700">GitHub</text>
    </g>
    <path d="M469 135h53" stroke="#b89f48" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g>
      <rect x="538" y="45" width="327" height="180" rx="15" fill="#182126" stroke="#d8c47a" stroke-width="2"/>
      <text x="701.5" y="79" text-anchor="middle" fill="#f2eee6" font-size="16" font-weight="700">GITHUB RUNS AUTOMATICALLY</text>
      <g transform="translate(560 103)">
        <rect width="82" height="54" rx="8" fill="#eef2f0"/>
        <text x="41" y="34" text-anchor="middle" fill="#101417" font-size="16" font-weight="700">Check</text>
      </g>
      <path d="M650 130h22" stroke="#64747c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
      <g transform="translate(681 103)">
        <rect width="74" height="54" rx="8" fill="#eef2f0"/>
        <text x="37" y="34" text-anchor="middle" fill="#101417" font-size="16" font-weight="700">Build</text>
      </g>
      <path d="M763 130h22" stroke="#64747c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>
      <g transform="translate(794 103)">
        <rect width="54" height="54" rx="8" fill="#d8c47a"/>
        <text x="27" y="24" text-anchor="middle" fill="#101417" font-size="12" font-weight="700">Publish</text>
        <text x="27" y="39" text-anchor="middle" fill="#101417" font-size="9">Pages</text>
      </g>
      <text x="701.5" y="195" text-anchor="middle" fill="#aeb8b3" font-size="15">No manual upload step</text>
    </g>
  </g>
</svg>
