<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Single-page Norna file pattern</title>
  <desc id="desc">A diagram showing that Norna expects a defined file pattern: content.md contains sections, image folders match section ids, theme.md and config.mjs stay separate, and the result is a browser page.</desc>
  <rect width="1080" height="620" rx="24" fill="#f7f3ea"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#61736d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .title { fill: #17201d; font-size: 25px; font-weight: 800; }
      .intro { fill: #41514c; font-size: 14px; }
      .label { fill: #17201d; font-size: 16px; font-weight: 800; }
      .small { fill: #61736d; font-size: 12px; }
      .body { fill: #41514c; font-size: 13px; }
      .code { fill: #20302b; font-size: 12px; }
      .code-light { fill: #f2eee6; font-size: 12px; }
      .key { fill: #78612a; font-size: 12px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #d7ded9; stroke-width: 1.4; }
      .dark { fill: #17201d; stroke: #445852; stroke-width: 1.4; }
      .tag { fill: #fff4c7; stroke: #d8c47a; stroke-width: 1.2; }
      .asset { fill: #e7f0f7; stroke: #9fb8c9; stroke-width: 1.2; }
      .note { fill: #eef3ef; stroke: #c4d2cb; stroke-width: 1.2; }
      .line { stroke: #61736d; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .soft-line { stroke: #d8c47a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <g class="sans">
    <text class="title" x="36" y="44">Single-page site</text>
    <text class="intro" x="36" y="70">The site is plain files, but the files follow a pattern Norna can understand.</text>

    <g transform="translate(36 112)">
      <rect class="panel" width="312" height="430" rx="16"/>
      <text class="label" x="22" y="32">1. Put files where Norna expects them</text>

      <g transform="translate(24 58)">
        <rect class="dark" width="264" height="128" rx="12"/>
        <text class="mono code-light" x="18" y="31">site/</text>
        <text class="mono code-light" x="38" y="58">content.md</text>
        <text class="mono code-light" x="38" y="82">theme.md</text>
        <text class="mono code-light" x="38" y="106">config.mjs</text>
      </g>

      <g transform="translate(24 216)">
        <rect class="tag" width="264" height="70" rx="10"/>
        <text class="mono key" x="18" y="29">images/what-we-do/</text>
        <text class="mono code" x="38" y="54">dog-house.svg</text>
      </g>

      <g transform="translate(24 310)">
        <rect class="asset" width="264" height="70" rx="10"/>
        <text class="mono key" x="18" y="29">images/how-you-can-help/</text>
        <text class="mono code" x="38" y="54">heart.svg</text>
      </g>
    </g>

    <path class="line" d="M374 327 H430" marker-end="url(#arrow)"/>

    <g transform="translate(430 112)">
      <rect class="panel" width="292" height="430" rx="16"/>
      <text class="label" x="22" y="32">2. Write sections in Markdown</text>

      <g transform="translate(24 58)">
        <rect class="dark" width="244" height="230" rx="12"/>
        <text class="mono code-light" x="16" y="31" font-weight="700">content.md</text>
        <text class="mono code-light" x="16" y="60">## What we do</text>
        <text class="mono key" x="16" y="82">{#what-we-do}</text>
        <text class="mono code-light" x="16" y="112">We rescue and rehome dogs.</text>
        <text class="mono code-light" x="16" y="142">```norna-image-stack</text>
        <text class="mono code-light" x="16" y="164">- image: dog-house.svg</text>
        <text class="mono code-light" x="16" y="186">```</text>
      </g>

      <g transform="translate(24 316)">
        <rect class="tag" width="114" height="52" rx="8"/>
        <text class="mono key" x="17" y="32">#what-we-do</text>
        <rect class="asset" x="130" width="114" height="52" rx="8"/>
        <text class="mono key" x="146" y="32">folder name</text>
      </g>
      <path class="soft-line" d="M142 342 H154"/>
      <text class="small" x="40" y="402">The section id connects text and local images.</text>
    </g>

    <path class="line" d="M748 327 H804" marker-end="url(#arrow)"/>

    <g transform="translate(804 112)">
      <rect class="panel" width="240" height="430" rx="16"/>
      <text class="label" x="20" y="32">3. Norna builds the page</text>

      <g transform="translate(20 58)">
        <rect class="panel" width="200" height="292" rx="14"/>
        <rect x="1" y="1" width="198" height="36" rx="13" fill="#eef3ef"/>
        <circle cx="17" cy="18" r="3.5" fill="#d8c47a"/>
        <circle cx="29" cy="18" r="3.5" fill="#c4d2cb"/>
        <circle cx="41" cy="18" r="3.5" fill="#c4d2cb"/>
        <rect x="54" y="9" width="128" height="18" rx="9" fill="#ffffff" stroke="#d7ded9"/>
        <text class="mono code" x="66" y="22" font-size="8.5">yoursite.example/</text>

        <rect x="20" y="58" width="160" height="32" rx="8" fill="#17201d"/>
        <text x="34" y="79" fill="#d8c47a" font-size="11" font-weight="800">What we do</text>
        <text x="108" y="79" fill="#f7f3ea" font-size="11">Help</text>

        <text x="22" y="130" fill="#17201d" font-size="20" font-weight="800">Dog Shelter</text>
        <text x="22" y="166" fill="#17201d" font-size="15" font-weight="800">What we do</text>
        <text x="22" y="190" fill="#41514c" font-size="12">We rescue dogs.</text>
        <rect x="118" y="202" width="50" height="42" rx="8" fill="#fff4c7" stroke="#d8c47a"/>
        <path d="M128 224 L143 210 L158 224" fill="#8c573a"/>
        <rect x="134" y="224" width="20" height="15" rx="2" fill="#d8c47a"/>
        <rect x="141" y="232" width="5" height="7" rx="1" fill="#17201d"/>
      </g>

      <rect class="note" x="20" y="382" width="200" height="30" rx="8"/>
      <text class="small" x="34" y="402">Less manual bookkeeping.</text>
    </g>
  </g>
</svg>
