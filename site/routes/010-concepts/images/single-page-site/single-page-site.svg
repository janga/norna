<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Single-page Norna site</title>
  <desc id="desc">The actual Dog Shelter example file tree, content Markdown and resulting single-page website are shown from left to right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#c7ad72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="dog-house" viewBox="0 0 800 520">
      <rect width="800" height="520" rx="32" fill="#eef3ef"/>
      <path d="M0 405 Q180 365 380 405 T800 390 V520 H0Z" fill="#cad8bd"/>
      <g stroke="#493c2b" stroke-width="8" stroke-linejoin="round">
        <path d="M190 247 L400 82 L610 247" fill="#9f493a"/>
        <path d="M236 222 H564 V432 H236Z" fill="#c8674f"/>
        <path d="M327 432 V300 Q327 234 400 234 Q473 234 473 300 V432Z" fill="#332d29"/>
        <path d="M213 244 L400 94 L587 244" fill="none" stroke="#7f3f32" stroke-width="24" stroke-linecap="round"/>
      </g>
      <g transform="translate(310 250)" stroke="#493c2b" stroke-width="6" stroke-linejoin="round">
        <path d="M40 119 C47 80 93 64 142 76 C181 86 196 119 184 158 H58 C42 151 34 135 40 119Z" fill="#b8794d"/>
        <path d="M62 94 C45 61 58 23 96 13 C133 3 169 27 168 64 C167 93 145 108 112 109 H76Z" fill="#b8794d"/>
        <path d="M76 32 L53 3 L98 17" fill="#8c573a"/>
        <path d="M143 25 L171 3 L164 46" fill="#8c573a"/>
        <circle cx="92" cy="53" r="6" fill="#272522" stroke="none"/>
        <circle cx="140" cy="53" r="6" fill="#272522" stroke="none"/>
        <ellipse cx="116" cy="76" rx="25" ry="19" fill="#dca477"/>
        <circle cx="116" cy="70" r="7" fill="#272522" stroke="none"/>
        <path d="M105 84 Q116 96 129 84" fill="none" stroke-linecap="round"/>
        <path d="M59 154 V188 M94 154 V188 M145 154 V188" fill="none" stroke-linecap="round"/>
        <path d="M177 105 Q220 80 211 39" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="heart" viewBox="0 0 800 520">
      <rect width="800" height="520" rx="32" fill="#f3eee5"/>
      <circle cx="400" cy="250" r="176" fill="#e5dccd"/>
      <path d="M400 354 C368 316 263 252 263 166 C263 108 309 79 354 92 C379 99 394 116 400 135 C406 116 421 99 446 92 C491 79 537 108 537 166 C537 252 432 316 400 354Z" fill="#b84f45" stroke="#493c2b" stroke-width="8" stroke-linejoin="round"/>
      <g fill="#d5a071" stroke="#493c2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M74 368 C144 330 211 328 291 365 L363 407 C382 420 373 451 350 450 L268 426 C228 414 191 421 154 451 L92 502 L30 429Z"/>
        <path d="M726 368 C656 330 589 328 509 365 L437 407 C418 420 427 451 450 450 L532 426 C572 414 609 421 646 451 L708 502 L770 429Z"/>
        <path d="M290 365 L350 349 C369 344 383 360 376 378 L363 407"/>
        <path d="M510 365 L450 349 C431 344 417 360 424 378 L437 407"/>
      </g>
    </symbol>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .tree { fill: #3f3b35; font-size: 11px; }
      .code { fill: #f8f5ee; font-size: 9.5px; }
      .muted-code { fill: #c9c1b4; font-size: 9.5px; }
      .key { fill: #e4c77d; font-size: 9.5px; font-weight: 700; }
      .panel { fill: #fffdf9; stroke: #d8d0c4; stroke-width: 1.4; }
      .document { fill: #3a3834; stroke: #272522; stroke-width: 1.4; }
      .line { stroke: #c7ad72; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
      .flow { stroke: #c7ad72; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <g class="sans">
    <g transform="translate(36 40)">
      <rect class="panel" width="300" height="540" rx="15"/>
      <g class="mono tree">
        <text x="22" y="32">site/</text>
        <text x="22" y="54">├── config.yaml</text>
        <text x="22" y="72">├── content.md</text>
        <text x="22" y="90">├── images/</text>
        <text x="22" y="108">│   ├── what-we-do/</text>
        <text x="22" y="126">│   │   └── dog-house.svg</text>
        <text x="22" y="144">│   └── you-can-help/</text>
        <text x="22" y="162">│       └── heart.svg</text>
        <text x="22" y="180">├── public/</text>
        <text x="22" y="198">│   ├── favicon.svg</text>
        <text x="22" y="216">│   └── robots.txt</text>
        <text x="22" y="234">├── sitewide-content.yaml</text>
        <text x="22" y="252">└── theme.yaml</text>
      </g>
    </g>

    <g transform="translate(394 40)">
      <rect class="panel" width="300" height="540" rx="15"/>
      <path class="document" d="M28 28 H244 L272 56 V490 H28 Z"/>
      <path d="M244 28 V56 H272 Z" fill="#f8f5ee" opacity=".9"/>
      <g class="mono">
        <text class="muted-code" x="46" y="68">---</text>
        <text class="code" x="46" y="88">title: Home</text>
        <text class="muted-code" x="46" y="108">---</text>
        <text class="key" x="46" y="140">## What we do {#what-we-do}</text>
        <text class="code" x="46" y="162">We rescue and rehome dogs.</text>
        <text class="code" x="46" y="194">```norna-image-stack</text>
        <text class="code" x="46" y="216">- image: dog-house.svg</text>
        <text class="code" x="46" y="238">  caption: Time to recover before adoption.</text>
        <text class="code" x="46" y="260">```</text>
        <text class="key" x="46" y="302">## You can help {#you-can-help}</text>
        <text class="code" x="46" y="324">Adopt. Foster. Donate.</text>
        <text class="code" x="46" y="356">```norna-image-stack</text>
        <text class="code" x="46" y="378">- image: heart.svg</text>
        <text class="code" x="46" y="400">  caption: Foster care helps another dog.</text>
        <text class="code" x="46" y="422">```</text>
        <text class="tree" x="150" y="518" text-anchor="middle">content.md</text>
      </g>
    </g>

    <path class="line" d="M213 144 L440 180" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path class="line" d="M214 180 L440 337" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path class="flow" d="M666 310 H748" marker-end="url(#arrow)"/>

    <g transform="translate(756 40)">
      <rect class="panel" width="288" height="540" rx="16"/>
      <rect x="1" y="1" width="286" height="42" rx="15" fill="#ebe5d9"/>
      <circle cx="22" cy="21" r="4" fill="#c7ad72"/>
      <circle cx="36" cy="21" r="4" fill="#c9c1b4"/>
      <circle cx="50" cy="21" r="4" fill="#c9c1b4"/>
      <rect x="66" y="11" width="200" height="20" rx="10" fill="#fffdf9" stroke="#d8d0c4"/>
      <text class="mono tree" x="78" y="25" font-size="9">https://yoursite.example/</text>

      <rect x="1" y="43" width="286" height="36" fill="#f8f5ee"/>
      <line x1="1" y1="79" x2="287" y2="79" stroke="#d8d0c4"/>
      <text x="68" y="66" fill="#272522" font-size="9" font-weight="700">WHAT WE DO</text>
      <line x1="68" y1="71" x2="130" y2="71" stroke="#272522"/>
      <text x="145" y="66" fill="#746e63" font-size="9">/</text>
      <text x="159" y="66" fill="#746e63" font-size="9">YOU CAN HELP</text>

      <text x="28" y="110" fill="#272522" font-size="19" font-weight="700">WHAT WE DO</text>
      <text x="28" y="131" fill="#4d4942" font-size="12">We rescue and rehome dogs.</text>
      <use href="#dog-house" x="38" y="143" width="212" height="138"/>
      <text x="28" y="298" fill="#746e63" font-size="11">Time to recover before adoption.</text>

      <rect x="1" y="310" width="286" height="229" fill="#ebe5d9"/>
      <text x="28" y="340" fill="#272522" font-size="19" font-weight="700">YOU CAN HELP</text>
      <text x="28" y="361" fill="#4d4942" font-size="12">Adopt. Foster. Donate.</text>
      <use href="#heart" x="38" y="373" width="212" height="138"/>
      <text x="28" y="528" fill="#746e63" font-size="11">Foster care helps another dog.</text>
    </g>
  </g>
</svg>
