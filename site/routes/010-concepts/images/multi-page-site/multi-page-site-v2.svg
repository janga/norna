<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Multi-page Norna route pattern</title>
  <desc id="desc">A diagram showing how numbered route folders become ordered site navigation, how route ids become URL slugs, and how each route keeps its own content and images.</desc>
  <rect width="1080" height="620" rx="24" fill="#f7f3ea"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#61736d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .title { fill: #17201d; font-size: 25px; font-weight: 800; }
      .intro { fill: #41514c; font-size: 14px; }
      .label { fill: #17201d; font-size: 16px; font-weight: 800; }
      .small { fill: #61736d; font-size: 12px; }
      .code { fill: #20302b; font-size: 12px; }
      .code-light { fill: #f2eee6; font-size: 12px; }
      .key { fill: #78612a; font-size: 12px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #d7ded9; stroke-width: 1.4; }
      .dark { fill: #17201d; stroke: #445852; stroke-width: 1.4; }
      .route-a { fill: #fff4c7; stroke: #d8c47a; stroke-width: 1.3; }
      .route-b { fill: #e7f0f7; stroke: #9fb8c9; stroke-width: 1.3; }
      .note { fill: #eef3ef; stroke: #c4d2cb; stroke-width: 1.2; }
      .line { stroke: #61736d; stroke-width: 2.4; fill: none; stroke-linecap: round; }
      .soft-line { stroke: #d8c47a; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <g class="sans">
    <text class="title" x="36" y="44">Multi-page site</text>
    <text class="intro" x="36" y="70">Routes add pages. The prefix controls order; the route id controls the URL.</text>

    <g transform="translate(36 112)">
      <rect class="panel" width="320" height="430" rx="16"/>
      <text class="label" x="22" y="32">Route folders</text>

      <g transform="translate(24 64)">
        <rect class="route-a" width="272" height="118" rx="12"/>
        <text class="mono key" x="18" y="30">010-dogs/</text>
        <text class="small" x="18" y="52">prefix 010: shown first</text>
        <text class="small" x="18" y="74">route id dogs: URL slug</text>
        <text class="mono code" x="36" y="102">route-content.md</text>
      </g>

      <g transform="translate(24 216)">
        <rect class="route-b" width="272" height="96" rx="12"/>
        <text class="mono key" x="18" y="30">020-adopt/</text>
        <text class="small" x="18" y="52">prefix 020: shown next</text>
        <text class="mono code" x="36" y="78">route-content.md</text>
      </g>

      <g transform="translate(24 344)">
        <rect class="note" width="272" height="48" rx="10"/>
        <text class="small" x="18" y="29">Routes contain content and images,</text>
        <text class="small" x="18" y="45">not technical site configuration.</text>
      </g>
    </g>

    <path class="line" d="M384 304 H438" marker-end="url(#arrow)"/>

    <g transform="translate(438 112)">
      <rect class="panel" width="276" height="430" rx="16"/>
      <text class="label" x="22" y="32">Current route</text>

      <g transform="translate(20 64)">
        <rect class="dark" width="236" height="216" rx="12"/>
        <text class="mono code-light" x="16" y="31" font-weight="700">route-content.md</text>
        <text class="mono code-light" x="16" y="62">title: Dogs</text>
        <text class="mono key" x="16" y="96">## Dogs {#dogs}</text>
        <text class="mono code-light" x="16" y="124">Meet Rover and Rex.</text>
        <text class="mono code-light" x="16" y="154">```norna-image-stack</text>
        <text class="mono code-light" x="16" y="176">- image: rover.svg</text>
        <text class="mono code-light" x="16" y="198">- image: rex.svg</text>
      </g>

      <g transform="translate(20 314)">
        <rect class="route-a" width="236" height="54" rx="10"/>
        <text class="mono key" x="16" y="32">images/dogs/</text>
        <text class="mono code" x="116" y="32">rover.svg rex.svg</text>
      </g>
      <path class="soft-line" d="M76 314 C90 300 106 292 126 280"/>
      <text class="small" x="38" y="404">The route uses the same content model as home.</text>
    </g>

    <path class="line" d="M742 304 H796" marker-end="url(#arrow)"/>

    <g transform="translate(796 112)">
      <rect class="panel" width="248" height="430" rx="16"/>
      <text class="label" x="20" y="32">Result on the site</text>

      <g transform="translate(20 64)">
        <rect class="panel" width="208" height="310" rx="14"/>
        <rect x="1" y="1" width="206" height="36" rx="13" fill="#eef3ef"/>
        <circle cx="18" cy="18" r="3.5" fill="#d8c47a"/>
        <circle cx="30" cy="18" r="3.5" fill="#c4d2cb"/>
        <circle cx="42" cy="18" r="3.5" fill="#c4d2cb"/>
        <rect x="54" y="9" width="138" height="18" rx="9" fill="#ffffff" stroke="#d7ded9"/>
        <text class="mono code" x="65" y="22" font-size="8.5">yoursite/dogs/</text>

        <rect x="20" y="58" width="168" height="64" rx="9" fill="#17201d"/>
        <text x="34" y="83" fill="#f7f3ea" font-size="15" font-weight="800">Dog Shelter</text>
        <text x="34" y="108" fill="#f7f3ea" font-size="11">Home</text>
        <text x="78" y="108" fill="#d8c47a" font-size="11" font-weight="800">Dogs</text>
        <text x="118" y="108" fill="#f7f3ea" font-size="11">Adopt</text>

        <rect x="20" y="142" width="168" height="28" rx="8" fill="#fff4c7" stroke="#d8c47a"/>
        <text class="mono key" x="34" y="161">010-dogs -> /dogs/</text>

        <text x="24" y="210" fill="#17201d" font-size="21" font-weight="800">Dogs</text>
        <text x="24" y="236" fill="#41514c" font-size="12">Meet Rover and Rex.</text>

        <g transform="translate(30 258)">
          <rect width="62" height="44" rx="8" fill="#eef4f0" stroke="#d7ded9"/>
          <path d="M15 29c10-7 20-8 31-3" fill="none" stroke="#4f8b6f" stroke-width="4" stroke-linecap="round"/>
          <path d="M20 25c0-8 7-14 16-14h5c8 0 14 6 14 14v5H20Z" fill="#d9a441" stroke="#2d2a26" stroke-width="2.5"/>
          <text x="31" y="60" text-anchor="middle" fill="#41514c" font-size="10">Rover</text>
        </g>

        <g transform="translate(116 258)">
          <rect width="62" height="44" rx="8" fill="#f4f0e8" stroke="#d7ded9"/>
          <path d="M16 25 31 12l15 13v16H16Z" fill="#d85845" stroke="#2d2a26" stroke-width="2.5"/>
          <path d="M31 22c-5-5-10-8-10-13 0-4 3-7 7-7 1 0 2 1 3 2 1-1 2-2 4-2 4 0 7 3 7 7 0 5-5 8-11 13Z" fill="#f7c948" stroke="#2d2a26" stroke-width="2"/>
          <text x="31" y="60" text-anchor="middle" fill="#41514c" font-size="10">Rex</text>
        </g>
      </g>

      <text class="small" x="28" y="408">Order and URL come from the folder name.</text>
    </g>
  </g>
</svg>
