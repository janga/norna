<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Multi-page Norna site</title>
  <desc id="desc">The actual Dog Shelter multi-page example file tree, Dogs route Markdown and resulting route page are shown from left to right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#c7ad72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="rover" viewBox="0 0 800 560">
      <rect width="800" height="560" rx="32" fill="#eaf2ec"/>
      <ellipse cx="404" cy="462" rx="270" ry="36" fill="#c8d9c7"/>
      <g stroke="#493c2b" stroke-width="9" stroke-linejoin="round">
        <path d="M215 313 C251 231 372 209 518 246 C590 265 622 332 593 402 H278 C220 391 191 354 215 313Z" fill="#b8794d"/>
        <path d="M259 271 C220 195 256 105 348 83 C438 61 526 118 523 208 C520 278 468 314 389 316 H294Z" fill="#b8794d"/>
        <path d="M291 128 L236 50 L340 86" fill="#8c573a"/>
        <path d="M454 109 L526 43 L505 159" fill="#8c573a"/>
        <circle cx="333" cy="181" r="11" fill="#272522" stroke="none"/>
        <circle cx="449" cy="181" r="11" fill="#272522" stroke="none"/>
        <ellipse cx="391" cy="236" rx="60" ry="45" fill="#dca477"/>
        <circle cx="391" cy="222" r="14" fill="#272522" stroke="none"/>
        <path d="M369 251 Q391 277 419 251" fill="none" stroke-linecap="round"/>
        <path d="M278 396 V479 M365 396 V479 M508 396 V479" fill="none" stroke-linecap="round"/>
        <path d="M565 280 Q680 224 660 120 Q646 81 618 103" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>
    <symbol id="rex" viewBox="0 0 800 560">
      <rect width="800" height="560" rx="32" fill="#f3eee3"/>
      <ellipse cx="404" cy="462" rx="270" ry="36" fill="#ddd1b8"/>
      <g stroke="#493c2b" stroke-width="9" stroke-linejoin="round">
        <path d="M218 316 C265 240 386 219 527 258 C594 277 623 343 589 404 H278 C221 391 196 354 218 316Z" fill="#e3c681"/>
        <path d="M274 275 C237 202 279 112 370 91 C458 71 538 132 528 218 C520 285 464 318 389 317 H307Z" fill="#e3c681"/>
        <path d="M309 134 L264 52 L365 91" fill="#c49b51"/>
        <path d="M465 111 Q560 96 551 181 Q529 214 488 197Z" fill="#c49b51"/>
        <circle cx="346" cy="187" r="11" fill="#272522" stroke="none"/>
        <circle cx="451" cy="187" r="11" fill="#272522" stroke="none"/>
        <ellipse cx="399" cy="239" rx="61" ry="45" fill="#f1dca9"/>
        <circle cx="399" cy="225" r="14" fill="#272522" stroke="none"/>
        <path d="M377 254 Q399 280 427 254" fill="none" stroke-linecap="round"/>
        <path d="M281 400 V479 M374 400 V479 M511 400 V479" fill="none" stroke-linecap="round"/>
        <path d="M568 294 Q676 330 642 420" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .tree { fill: #3f3b35; font-size: 10px; }
      .code { fill: #f8f5ee; font-size: 9.5px; }
      .muted-code { fill: #c9c1b4; font-size: 9.5px; }
      .key { fill: #e4c77d; font-size: 9.5px; font-weight: 700; }
      .panel { fill: #fffdf9; stroke: #d8d0c4; stroke-width: 1.4; }
      .document { fill: #3a3834; stroke: #272522; stroke-width: 1.4; }
      .document-muted { fill: #bcb7ae; stroke: #8c867c; stroke-width: 1.4; }
      .line { stroke: #c7ad72; stroke-width: 1.4; stroke-dasharray: 5 5; fill: none; }
      .flow { stroke: #c7ad72; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <g class="sans">
    <g transform="translate(36 40)">
      <rect class="panel" width="300" height="540" rx="15"/>
      <g class="mono tree">
        <text x="20" y="30">site/</text>
        <text x="20" y="50">├── config.md</text>
        <text x="20" y="68">├── content.md</text>
        <text x="20" y="86">├── public/</text>
        <text x="20" y="104">│   ├── favicon.svg</text>
        <text x="20" y="122">│   └── robots.txt</text>
        <text x="20" y="140">├── routes/</text>
        <text x="20" y="158">│   ├── 010-dogs/</text>
        <text x="20" y="176">│   │   ├── images/</text>
        <text x="20" y="194">│   │   │   └── dogs/</text>
        <text x="20" y="212">│   │   │       ├── rex.svg</text>
        <text x="20" y="230">│   │   │       └── rover.svg</text>
        <text x="20" y="248">│   │   └── content.md</text>
        <text x="20" y="266">│   └── 020-adopt/</text>
        <text x="20" y="284">│       └── content.md</text>
        <text x="20" y="302">├── sitewide-content.md</text>
        <text x="20" y="320">└── theme.md</text>
      </g>
    </g>

    <g transform="translate(394 40)">
      <rect class="panel" width="300" height="540" rx="15"/>
      <path class="document" d="M28 26 H244 L272 54 V374 H28 Z"/>
      <path d="M244 26 V54 H272 Z" fill="#f8f5ee" opacity=".9"/>
      <g class="mono">
        <text class="muted-code" x="46" y="68">---</text>
        <text class="code" x="46" y="88">title: Dogs</text>
        <text class="muted-code" x="46" y="108">---</text>
        <text class="key" x="46" y="140">## Dogs {#dogs}</text>
        <text class="code" x="46" y="162">Meet Rover and Rex.</text>
        <text class="code" x="46" y="194">```norna-image-stack</text>
        <text class="code" x="46" y="216">- image: rover.svg</text>
        <text class="code" x="46" y="238">  caption: Rover needs daily walks.</text>
        <text class="code" x="46" y="266">- image: rex.svg</text>
        <text class="code" x="46" y="288">  caption: Rex needs a patient home.</text>
        <text class="code" x="46" y="310">```</text>
        <text class="tree" x="150" y="398" text-anchor="middle">content.md</text>
      </g>

      <path class="document-muted" d="M28 424 H244 L272 452 V482 H28 Z" opacity=".7"/>
      <path d="M244 424 V452 H272 Z" fill="#f8f5ee" opacity=".55"/>
      <text class="mono" x="46" y="462" fill="#5f5a52" font-size="10">## Adopt {#adopt}</text>
      <text class="mono tree" x="150" y="510" text-anchor="middle" opacity=".75">content.md</text>
    </g>

    <path class="line" d="M161 194 L440 198" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path class="line" d="M169 302 L440 485" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path class="flow" d="M666 310 H748" marker-end="url(#arrow)"/>

    <g transform="translate(756 40)">
      <rect class="panel" width="288" height="540" rx="16"/>
      <rect x="1" y="1" width="286" height="42" rx="15" fill="#ebe5d9"/>
      <circle cx="22" cy="21" r="4" fill="#c7ad72"/>
      <circle cx="36" cy="21" r="4" fill="#c9c1b4"/>
      <circle cx="50" cy="21" r="4" fill="#c9c1b4"/>
      <rect x="66" y="11" width="200" height="20" rx="10" fill="#fffdf9" stroke="#d8d0c4"/>
      <text class="mono tree" x="78" y="25" font-size="9">https://yoursite.example/dogs/</text>

      <text x="22" y="67" fill="#272522" font-size="11" font-weight="800">DOG SHELTER</text>
      <text x="174" y="67" fill="#746e63" font-size="9">HOME</text>
      <text x="211" y="67" fill="#272522" font-size="9" text-decoration="underline">DOGS</text>
      <text x="249" y="67" fill="#746e63" font-size="9">ADOPT</text>
      <line x1="1" y1="80" x2="287" y2="80" stroke="#d8d0c4"/>

      <text x="28" y="116" fill="#272522" font-size="20" font-weight="700">DOGS</text>
      <text x="28" y="139" fill="#4d4942" font-size="12">Meet Rover and Rex.</text>

      <use href="#rover" x="44" y="157" width="200" height="140"/>
      <text x="28" y="316" fill="#746e63" font-size="11">Rover needs daily walks.</text>

      <use href="#rex" x="44" y="340" width="200" height="140"/>
      <text x="28" y="499" fill="#746e63" font-size="11">Rex needs a patient home.</text>
    </g>
  </g>
</svg>
