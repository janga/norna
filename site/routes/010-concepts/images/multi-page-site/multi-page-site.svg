<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">A multi-page Norna site</title>
  <desc id="desc">A three-column diagram showing how route folders become route content, hierarchical navigation and URL slugs in a Norna website.</desc>
  <rect width="1080" height="520" rx="22" fill="#f7f3ea"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#61736d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="small-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#61736d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .title { fill: #17201d; font-size: 25px; font-weight: 800; }
      .intro { fill: #41514c; font-size: 14px; }
      .col-title { fill: #17201d; font-size: 18px; font-weight: 800; }
      .small { fill: #61736d; font-size: 12px; }
      .code { fill: #20302b; font-size: 12px; }
      .code-light { fill: #f2eee6; font-size: 12px; }
      .code-muted { fill: #cbd5cf; font-size: 12px; }
      .key { fill: #78612a; font-size: 12px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #d7ded9; stroke-width: 1.4; }
      .dark { fill: #17201d; stroke: #445852; stroke-width: 1.4; }
      .dark-muted { fill: #46534f; stroke: #c4d2cb; stroke-width: 1.4; }
      .mark { fill: #fff4c7; stroke: #d8c47a; stroke-width: 1.3; }
      .connector { stroke: #d8c47a; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <g class="sans">
    <text class="title" x="36" y="44">Multi-page site</text>
    <text class="intro" x="36" y="70">Routes add pages. The numeric prefix sets page order; the route id becomes the default URL slug.</text>

    <text class="col-title" x="36" y="116">Files</text>
    <text class="col-title" x="394" y="116">File content</text>
    <text class="col-title" x="756" y="116">Website</text>

    <path d="M336 302h34" stroke="#61736d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M694 302h34" stroke="#61736d" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(36 140)">
      <rect class="panel" width="300" height="352" rx="15"/>
      <text class="mono code" x="22" y="34">site/</text>
      <text class="mono code" x="42" y="62">content.md</text>
      <text class="small" x="126" y="62">Home</text>
      <text class="mono code" x="42" y="90">theme.md</text>
      <text class="mono code" x="42" y="118">config.mjs</text>
      <text class="mono code" x="42" y="150">routes/</text>

      <rect class="mark" x="58" y="168" width="238" height="122" rx="8"/>
      <text class="mono key" x="72" y="192">010-dogs/</text>
      <text class="mono code" x="92" y="214">route-content.md</text>
      <text class="mono code" x="92" y="236">images/</text>
      <text class="mono key" x="112" y="258">dogs/</text>
      <text class="mono code" x="126" y="280">rover.svg</text>
      <text class="mono code" x="200" y="280">rex.svg</text>

      <rect class="mark" x="58" y="308" width="202" height="50" rx="8"/>
      <text class="mono key" x="72" y="331">020-adopt/</text>
      <text class="mono code" x="92" y="351">route-content.md</text>
    </g>

    <g transform="translate(394 140)">
      <rect class="panel" width="300" height="352" rx="15"/>

      <g transform="translate(20 22)">
        <rect class="dark" width="260" height="230" rx="12"/>
        <text class="mono code-light" x="16" y="30" font-weight="700">010-dogs/route-content.md</text>
        <text class="mono code-muted" x="16" y="54">---</text>
        <text class="mono code-light" x="16" y="75">title: Dogs</text>
        <text class="mono code-muted" x="16" y="96">---</text>
        <text class="mono key" x="16" y="120">## Dogs {#dogs}</text>
        <text class="mono code-light" x="16" y="144">Meet Rover and Rex.</text>
        <text class="mono code-light" x="16" y="170">```norna-image-stack</text>
        <text class="mono code-light" x="16" y="192">- image: rover.svg</text>
        <text class="mono code-light" x="16" y="214">- image: rex.svg</text>
        <text class="mono code-light" x="16" y="236">```</text>
      </g>

      <g transform="translate(20 270)" opacity="0.58">
        <rect class="dark-muted" width="260" height="50" rx="12"/>
        <text class="mono code-light" x="16" y="28" font-weight="700">020-adopt/route-content.md</text>
        <text class="mono code-light" x="16" y="43">## Adopt {#adopt}</text>
      </g>
    </g>

    <path d="M296 306 C342 276 372 238 406 214" stroke="#61736d" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#small-arrow)"/>
    <path class="connector" d="M260 472 C332 454 370 430 414 426" marker-end="url(#small-arrow)"/>

    <g transform="translate(756 140)">
      <rect class="panel" width="288" height="352" rx="16"/>
      <rect x="1" y="1" width="286" height="39" rx="15" fill="#eef3ef"/>
      <rect x="1" y="25" width="286" height="18" fill="#eef3ef"/>
      <circle cx="18" cy="20" r="3.5" fill="#d8c47a"/>
      <circle cx="30" cy="20" r="3.5" fill="#c4d2cb"/>
      <circle cx="42" cy="20" r="3.5" fill="#c4d2cb"/>
      <rect x="54" y="10" width="218" height="20" rx="10" fill="#ffffff" stroke="#d7ded9"/>
      <text class="mono code" x="63" y="24" font-size="9">yoursite.example/dogs/</text>

      <rect x="24" y="58" width="240" height="70" rx="9" fill="#17201d"/>
      <text x="42" y="82" fill="#f7f3ea" font-size="16" font-weight="800">Dog Shelter</text>
      <text x="42" y="110" fill="#f7f3ea" font-size="12">Home</text>
      <text x="88" y="110" fill="#d8c47a" font-size="12" font-weight="800">Dogs</text>
      <text x="130" y="110" fill="#f7f3ea" font-size="12">Adopt</text>

      <rect x="24" y="130" width="240" height="32" rx="8" fill="#edf3ef" stroke="#c4d2cb"/>
      <text x="42" y="151" fill="#17201d" font-size="12" font-weight="800">Dogs</text>
      <text x="88" y="151" fill="#61736d" font-size="12">Visiting</text>

      <text x="30" y="208" fill="#17201d" font-size="23" font-weight="800">Dogs</text>
      <text x="30" y="236" fill="#41514c" font-size="13">Meet Rover and Rex.</text>

      <g transform="translate(36 260)">
        <rect width="94" height="70" rx="10" fill="#eef4f0" stroke="#d7ded9"/>
        <g transform="translate(12 11) scale(0.3)">
          <path d="M64 106c18-12 34-16 56-16s38 4 56 16" fill="none" stroke="#2d2a26" stroke-width="12" stroke-linecap="round"/>
          <path d="M54 116c24 14 108 14 132 0" fill="none" stroke="#4f8b6f" stroke-width="12" stroke-linecap="round"/>
          <path d="M92 76c0-18 14-32 32-32h18c17 0 30 13 30 30v12H92Z" fill="#d9a441" stroke="#2d2a26" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="118" cy="63" r="4" fill="#2d2a26"/>
          <path d="M158 54h24l-20 18Z" fill="#d9a441" stroke="#2d2a26" stroke-width="6" stroke-linejoin="round"/>
          <path d="M98 50 78 34l4 28Z" fill="#d9a441" stroke="#2d2a26" stroke-width="6" stroke-linejoin="round"/>
          <path d="M92 86h82" stroke="#2d2a26" stroke-width="6" stroke-linecap="round"/>
        </g>
        <text x="47" y="88" text-anchor="middle" fill="#41514c" font-size="11">Rover</text>
      </g>

      <g transform="translate(156 260)">
        <rect width="94" height="70" rx="10" fill="#f4f0e8" stroke="#d7ded9"/>
        <g transform="translate(12 11) scale(0.3)">
          <path d="M48 78 120 28l72 50v52H48Z" fill="#d85845" stroke="#2d2a26" stroke-width="6" stroke-linejoin="round"/>
          <path d="M72 82h96v48H72Z" fill="#fff9ef" stroke="#2d2a26" stroke-width="6" stroke-linejoin="round"/>
          <path d="M104 130V96a16 16 0 0 1 32 0v34Z" fill="#2d2a26"/>
          <path d="M120 74c-14-12-28-20-28-34 0-10 8-18 18-18 5 0 9 2 10 6 2-4 6-6 11-6 10 0 18 8 18 18 0 14-15 22-29 34Z" fill="#f7c948" stroke="#2d2a26" stroke-width="4" stroke-linejoin="round"/>
        </g>
        <text x="47" y="88" text-anchor="middle" fill="#41514c" font-size="11">Rex</text>
      </g>
    </g>
  </g>
</svg>
