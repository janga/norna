<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Norna site files become content and a website</title>
  <desc id="desc">A three-column illustration showing Norna files, Markdown content and the resulting Dog Shelter website. Section ids connect Markdown sections to image folders, and route prefixes set navigation order.</desc>
  <rect width="1320" height="760" rx="24" fill="#f7f3ea"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#61736d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .title { fill: #17201d; font-size: 27px; font-weight: 800; }
      .col-title { fill: #17201d; font-size: 19px; font-weight: 800; }
      .body { fill: #41514c; font-size: 14px; }
      .small { fill: #61736d; font-size: 12px; }
      .code { fill: #20302b; font-size: 12px; }
      .code-muted { fill: #61736d; font-size: 12px; }
      .code-key { fill: #78612a; font-size: 12px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #d7ded9; stroke-width: 1.5; }
      .panel-dark { fill: #17201d; stroke: #445852; stroke-width: 1.5; }
      .highlight { fill: #fff4c7; stroke: #d8c47a; stroke-width: 1.4; }
      .link { stroke: #d8c47a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <g class="sans">
    <text class="title" x="42" y="52">Files are the interface</text>
    <text class="body" x="42" y="78">A small Norna site is described with files. Norna turns them into pages, navigation, images and presentation.</text>

    <text class="col-title" x="42" y="126">Files</text>
    <text class="col-title" x="462" y="126">Content in files</text>
    <text class="col-title" x="922" y="126">Website</text>

    <path d="M382 382h48" stroke="#61736d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M842 382h48" stroke="#61736d" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(42 150)">
      <rect class="panel" width="340" height="550" rx="16"/>
      <text class="mono code" x="24" y="36">site/</text>
      <text class="mono code" x="44" y="62">theme.md</text>
      <text class="small" x="132" y="62">visual defaults and presets</text>
      <text class="mono code" x="44" y="88">content.md</text>
      <text class="small" x="132" y="88">homepage</text>
      <text class="mono code" x="44" y="114">images/</text>
      <rect class="highlight" x="60" y="128" width="190" height="50" rx="8"/>
      <text class="mono code-key" x="72" y="149">what-we-do/</text>
      <text class="mono code" x="92" y="169">dog-house.svg</text>
      <rect class="highlight" x="60" y="190" width="220" height="50" rx="8"/>
      <text class="mono code-key" x="72" y="211">how-you-can-help/</text>
      <text class="mono code" x="92" y="231">heart.svg</text>
      <text class="mono code" x="44" y="270">routes/</text>
      <rect class="highlight" x="60" y="284" width="250" height="128" rx="8"/>
      <text class="mono code-key" x="72" y="306">010-our-dogs/</text>
      <text class="mono code" x="92" y="328">route-content.md</text>
      <text class="mono code" x="92" y="350">images/</text>
      <text class="mono code-key" x="112" y="372">dogs/</text>
      <text class="mono code" x="132" y="394">rover.svg  rex.svg</text>
      <rect class="highlight" x="60" y="424" width="250" height="62" rx="8"/>
      <text class="mono code-key" x="72" y="446">020-contact-info/</text>
      <text class="mono code" x="92" y="468">route-content.md</text>
      <text class="small" x="24" y="522">010 / 020 set navigation order</text>
    </g>

    <g transform="translate(462 150)">
      <rect class="panel" width="380" height="550" rx="16"/>

      <g transform="translate(22 24)">
        <rect class="panel-dark" width="336" height="258" rx="12"/>
        <text class="mono" x="18" y="30" fill="#f2eee6" font-size="13" font-weight="700">content.md</text>
        <text class="mono code-muted" x="18" y="56">---</text>
        <text class="mono" x="18" y="78" fill="#f2eee6" font-size="12">title: Dog Shelter</text>
        <text class="mono code-muted" x="18" y="100">---</text>
        <rect class="highlight" x="14" y="116" width="208" height="28" rx="6"/>
        <text class="mono code-key" x="22" y="135">## What we do {#what-we-do}</text>
        <text class="mono" x="22" y="161" fill="#f2eee6" font-size="12">We rescue and rehome dogs.</text>
        <text class="mono" x="22" y="188" fill="#f2eee6" font-size="12">```norna-image-stack</text>
        <text class="mono" x="22" y="210" fill="#f2eee6" font-size="12">- image: dog-house.svg</text>
        <text class="mono" x="22" y="232" fill="#f2eee6" font-size="12">```</text>
      </g>

      <g transform="translate(22 304)">
        <rect class="panel-dark" width="336" height="124" rx="12"/>
        <text class="mono" x="18" y="30" fill="#f2eee6" font-size="13" font-weight="700">content.md</text>
        <rect class="highlight" x="14" y="44" width="276" height="28" rx="6"/>
        <text class="mono code-key" x="22" y="63">## How you can help {#how-you-can-help}</text>
        <text class="mono" x="22" y="92" fill="#f2eee6" font-size="12">Adopt. Foster. Donate.</text>
      </g>

      <g transform="translate(22 446)">
        <rect class="panel-dark" width="164" height="80" rx="12"/>
        <text class="mono" x="14" y="28" fill="#f2eee6" font-size="12" font-weight="700">theme.md</text>
        <text class="small" x="14" y="51" fill="#cbd5cf">sets the visual tone</text>
        <text class="small" x="14" y="69" fill="#cbd5cf">for the site</text>
      </g>

      <g transform="translate(204 446)">
        <rect class="panel-dark" width="154" height="80" rx="12"/>
        <text class="mono" x="14" y="28" fill="#f2eee6" font-size="12" font-weight="700">route-content.md</text>
        <text class="mono" x="14" y="51" fill="#f2eee6" font-size="12">## Dogs {#dogs}</text>
        <text class="mono" x="14" y="69" fill="#f2eee6" font-size="12">rover.svg  rex.svg</text>
      </g>
    </g>

    <path class="link" d="M300 296 C380 270 438 282 536 282"/>
    <path class="link" d="M318 530 C382 574 470 640 668 638"/>

    <g transform="translate(922 150)">
      <rect class="panel" width="356" height="550" rx="18"/>
      <rect x="26" y="26" width="304" height="44" rx="10" fill="#17201d"/>
      <text x="48" y="54" fill="#f7f3ea" font-size="18" font-weight="800">Dog Shelter</text>
      <text x="172" y="54" fill="#d8c47a" font-size="12" font-weight="700">Home</text>
      <text x="222" y="54" fill="#f7f3ea" font-size="12">Our dogs</text>
      <text x="286" y="54" fill="#f7f3ea" font-size="12">Contact</text>

      <text x="32" y="112" fill="#17201d" font-size="23" font-weight="800">Dog Shelter</text>
      <g transform="translate(32 142)">
        <rect width="292" height="112" rx="14" fill="#fffaf0" stroke="#e0d6bd"/>
        <text x="18" y="34" fill="#17201d" font-size="17" font-weight="800">What we do</text>
        <text x="18" y="60" fill="#41514c" font-size="13">We rescue and rehome dogs.</text>
        <g transform="translate(216 28)">
          <rect x="10" y="28" width="42" height="34" rx="4" fill="#d8c47a"/>
          <path d="M4 32 L31 8 L58 32" fill="#8c573a"/>
          <rect x="28" y="44" width="12" height="18" rx="2" fill="#17201d"/>
        </g>
      </g>

      <g transform="translate(32 274)">
        <rect width="292" height="100" rx="14" fill="#fffaf0" stroke="#e0d6bd"/>
        <text x="18" y="34" fill="#17201d" font-size="17" font-weight="800">How you can help</text>
        <text x="18" y="60" fill="#41514c" font-size="13">Adopt. Foster. Donate.</text>
        <path d="M240 36 C230 24 210 32 212 50 C214 66 240 76 240 76 C240 76 266 66 268 50 C270 32 250 24 240 36Z" fill="#c85555"/>
      </g>

      <g transform="translate(32 408)">
        <rect width="292" height="104" rx="14" fill="#edf3ef" stroke="#cbd8d1"/>
        <text x="18" y="30" fill="#17201d" font-size="15" font-weight="800">Our dogs</text>
        <text x="18" y="50" fill="#61736d" font-size="12">010-our-dogs appears before contact</text>
        <g transform="translate(44 62)">
          <ellipse cx="30" cy="18" rx="28" ry="14" fill="#b7784f"/>
          <circle cx="58" cy="10" r="13" fill="#b7784f"/>
          <circle cx="62" cy="7" r="2" fill="#17201d"/>
          <path d="M67 13 l12 3 l-12 4z" fill="#17201d"/>
          <text x="30" y="48" text-anchor="middle" fill="#41514c" font-size="11">Rover</text>
        </g>
        <g transform="translate(170 62)">
          <ellipse cx="30" cy="18" rx="26" ry="15" fill="#f2eee6" stroke="#41514c"/>
          <circle cx="58" cy="10" r="13" fill="#f2eee6" stroke="#41514c"/>
          <path d="M50 2 l-12 -14 l2 20z" fill="#41514c"/>
          <circle cx="62" cy="7" r="2" fill="#17201d"/>
          <path d="M68 13 l10 3 l-10 4z" fill="#17201d"/>
          <text x="30" y="48" text-anchor="middle" fill="#41514c" font-size="11">Rex</text>
        </g>
      </g>
    </g>
  </g>
</svg>
