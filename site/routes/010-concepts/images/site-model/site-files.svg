<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Norna files mapped to pages</title>
  <desc id="desc">A Norna homepage is defined by content.md and homepage images. Additional routes are separate content pages under routes, ordered by numeric prefixes and able to keep their own images.</desc>
  <rect width="900" height="640" rx="22" fill="#101417"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#d8c47a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#8fa09a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="50" fill="#f2eee6" font-size="23" font-weight="700">Site files become pages</text>
    <text x="42" y="75" fill="#aeb8b3" font-size="14">Markdown order defines page sections. Route directory names define route order and slugs.</text>

    <g transform="translate(42 108)">
      <rect width="292" height="176" rx="15" fill="#182126" stroke="#52626b"/>
      <text x="22" y="32" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700">site/content.md</text>
      <text x="22" y="58" fill="#aeb8b3" font-size="13">Homepage content</text>
      <text x="22" y="88" fill="#f2eee6" font-size="13" font-weight="700">Markdown sections</text>
      <text x="38" y="112" fill="#aeb8b3" font-size="13">1. Intro</text>
      <text x="38" y="133" fill="#aeb8b3" font-size="13">2. Why Norna</text>
      <text x="38" y="154" fill="#aeb8b3" font-size="13">3. How Norna works</text>
    </g>

    <g transform="translate(42 314)">
      <rect width="292" height="118" rx="15" fill="#182126" stroke="#52626b"/>
      <text x="22" y="32" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700">site/images/</text>
      <text x="22" y="58" fill="#aeb8b3" font-size="13">Homepage source images</text>
      <text x="38" y="86" fill="#aeb8b3" font-family="Menlo, Consolas, monospace" font-size="13">intro/portrait.jpg</text>
      <text x="38" y="106" fill="#aeb8b3" font-family="Menlo, Consolas, monospace" font-size="13">model/site-files.svg</text>
    </g>

    <path d="M344 180h86" stroke="#d8c47a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M344 366c34 0 52-60 86-98" stroke="#8fa09a" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow-muted)"/>

    <g transform="translate(454 118)">
      <rect width="352" height="206" rx="18" fill="#eef2f0"/>
      <rect x="28" y="30" width="296" height="28" rx="6" fill="#d8c47a"/>
      <text x="176" y="50" text-anchor="middle" fill="#101417" font-size="16" font-weight="800">Homepage</text>
      <line x1="44" y1="84" x2="308" y2="84" stroke="#52626b" stroke-width="2"/>
      <line x1="44" y1="122" x2="264" y2="122" stroke="#52626b" stroke-width="2"/>
      <line x1="44" y1="160" x2="288" y2="160" stroke="#52626b" stroke-width="2"/>
      <g fill="#101417" font-size="13" font-weight="700">
        <text x="52" y="78">Intro</text>
        <text x="52" y="116">Why Norna</text>
        <text x="52" y="154">How Norna works</text>
      </g>
      <rect x="218" y="88" width="74" height="50" rx="8" fill="#c8d7d2"/>
      <text x="255" y="117" text-anchor="middle" fill="#101417" font-size="12" font-weight="700">image</text>
    </g>

    <g transform="translate(42 486)">
      <rect width="292" height="116" rx="15" fill="#182126" stroke="#52626b"/>
      <text x="22" y="30" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700">routes/010-getting-started/</text>
      <text x="22" y="56" fill="#aeb8b3" font-size="13">010 orders site navigation</text>
      <text x="22" y="78" fill="#aeb8b3" font-size="13">getting-started becomes the slug</text>
      <text x="22" y="102" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="13">route-content.md + images/</text>
    </g>

    <g transform="translate(364 500)">
      <rect width="196" height="74" rx="14" fill="#182126" stroke="#52626b"/>
      <text x="22" y="30" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700">routes/020-concepts/</text>
      <text x="22" y="54" fill="#aeb8b3" font-size="13">next route in navigation</text>
    </g>

    <path d="M344 602c76 8 116 8 178-38" stroke="#8fa09a" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow-muted)"/>
    <path d="M570 538h55" stroke="#8fa09a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-muted)"/>

    <g transform="translate(640 460)" opacity="0.86">
      <rect width="218" height="132" rx="16" fill="#eef2f0"/>
      <rect x="24" y="24" width="170" height="24" rx="6" fill="#c8d7d2"/>
      <text x="109" y="42" text-anchor="middle" fill="#101417" font-size="13" font-weight="800">Getting Started</text>
      <line x1="36" y1="70" x2="178" y2="70" stroke="#52626b" stroke-width="2"/>
      <line x1="36" y1="98" x2="154" y2="98" stroke="#52626b" stroke-width="2"/>
      <text x="36" y="66" fill="#101417" font-size="11" font-weight="700">Create a site</text>
      <text x="36" y="94" fill="#101417" font-size="11" font-weight="700">Understand files</text>
    </g>
  </g>
</svg>
