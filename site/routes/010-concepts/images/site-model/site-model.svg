<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Norna site model</title>
  <desc id="desc">Site files describing content, presentation, configuration, routes and assets flow through Norna and become a responsive website.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#b89f48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(40 55)">
      <rect width="230" height="140" rx="14" fill="#182126" stroke="#52626b" stroke-width="2"/>
      <text x="115" y="79" text-anchor="middle" fill="#f2eee6" font-size="26" font-weight="700">Site files</text>
    </g>
    <path d="M292 125h70" stroke="#b89f48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(384 55)">
      <rect width="180" height="140" rx="14" fill="#d8c47a"/>
      <text x="90" y="80" text-anchor="middle" fill="#101417" font-size="31" font-weight="800">Norna</text>
    </g>
    <path d="M586 125h70" stroke="#b89f48" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(678 55)">
      <rect width="182" height="140" rx="14" fill="#eef2f0" stroke="#aeb8b3" stroke-width="2"/>
      <rect x="34" y="30" width="114" height="64" rx="5" fill="#f8f5ee" stroke="#101417" stroke-width="2"/>
      <path d="M34 43h114" stroke="#101417" stroke-width="2"/>
      <circle cx="44" cy="37" r="2.5" fill="#101417"/>
      <circle cx="53" cy="37" r="2.5" fill="#101417"/>
      <text x="91" y="121" text-anchor="middle" fill="#101417" font-size="23" font-weight="700">Website</text>
    </g>
  </g>
</svg>
