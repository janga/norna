<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Norna file workflow</title>
  <desc id="desc">Norna builds a static website from site files, including config, theme, content, routes, images and public files.</desc>
  <rect width="1400" height="760" rx="28" fill="#101417"/>

  <g fill="#f2eee6" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="82" font-size="30" font-weight="700">files</text>
    <text x="640" y="82" font-size="30" font-weight="700">Norna</text>
    <text x="1008" y="82" font-size="30" font-weight="700">static website</text>
  </g>

  <g transform="translate(78 122)" font-family="Arial, Helvetica, sans-serif">
    <rect width="470" height="560" rx="18" fill="#182126" stroke="#52626b"/>
    <text x="28" y="44" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700">site/</text>

    <g transform="translate(28 74)">
      <rect width="414" height="64" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">config.mjs</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">URL, base path, language, footer, deploy settings</text>
    </g>

    <g transform="translate(28 154)">
      <rect width="414" height="64" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">theme.md</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">layout, typography, image sizing, colors</text>
    </g>

    <g transform="translate(28 234)">
      <rect width="414" height="64" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">content.md</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">homepage content, sections, image rows</text>
    </g>

    <g transform="translate(28 314)">
      <rect width="414" height="96" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">routes/</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">additional pages</text>
      <text x="18" y="72" fill="#aeb8b3" font-size="14">each route has route-content.md</text>
      <text x="18" y="94" fill="#aeb8b3" font-size="14">and can use route images and public files</text>
    </g>

    <g transform="translate(28 426)">
      <rect width="414" height="64" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">images/</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">source images for sections and routes</text>
    </g>

    <g transform="translate(28 506)">
      <rect width="414" height="64" rx="10" fill="#243039"/>
      <text x="18" y="28" fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="18">public/</text>
      <text x="18" y="50" fill="#aeb8b3" font-size="14">robots.txt, favicons, CNAME, static files</text>
    </g>
  </g>

  <path d="M590 386h112" stroke="#d8c47a" stroke-width="8" stroke-linecap="round"/>
  <path d="m694 360 34 26-34 26" fill="none" stroke="#d8c47a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(746 278)" font-family="Arial, Helvetica, sans-serif">
    <rect width="210" height="210" rx="28" fill="#d8c47a"/>
    <text x="105" y="93" text-anchor="middle" fill="#101417" font-size="38" font-weight="800">Norna</text>
    <text x="105" y="132" text-anchor="middle" fill="#101417" font-family="Menlo, Consolas, monospace" font-size="18">check</text>
    <text x="105" y="162" text-anchor="middle" fill="#101417" font-family="Menlo, Consolas, monospace" font-size="18">build</text>
  </g>

  <path d="M990 386h112" stroke="#d8c47a" stroke-width="8" stroke-linecap="round"/>
  <path d="m1094 360 34 26-34 26" fill="none" stroke="#d8c47a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1146 210)" font-family="Arial, Helvetica, sans-serif">
    <rect width="190" height="280" rx="18" fill="#eef2f0"/>
    <rect width="190" height="44" rx="18" fill="#ccd5d1"/>
    <rect x="22" y="76" width="146" height="22" rx="6" fill="#172126"/>
    <rect x="22" y="120" width="104" height="18" rx="5" fill="#7f8b86"/>
    <rect x="22" y="158" width="146" height="68" rx="10" fill="#d8c47a"/>
    <rect x="22" y="244" width="120" height="16" rx="5" fill="#7f8b86"/>
    <text x="95" y="330" text-anchor="middle" fill="#f2eee6" font-size="18">HTML, CSS, assets</text>
  </g>
</svg>
