<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-labelledby="title desc">
  <title id="title">Norna build and publishing workflow</title>
  <desc id="desc">Norna turns site files describing content, presentation, configuration, routes and assets into a static website in dist. GitHub Pages is the integrated publishing target today, while a dashed branch shows possible future integrations with other static hosts.</desc>
  <rect width="760" height="820" rx="28" fill="#101417"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="50" y="62" fill="#f2eee6" font-size="30" font-weight="700">Site files</text>
    <text x="50" y="92" fill="#aeb8b3" font-size="18">You describe the site</text>

    <g transform="translate(48 118)">
      <rect width="664" height="188" rx="18" fill="#182126" stroke="#52626b"/>
      <g fill="#f2eee6" font-family="Menlo, Consolas, monospace" font-size="23" font-weight="700">
        <text x="28" y="48">content.md</text>
        <text x="28" y="94">theme.md</text>
        <text x="28" y="140">config.mjs</text>
        <text x="352" y="48">routes/</text>
        <text x="352" y="94">images/</text>
        <text x="352" y="140">public/</text>
      </g>
      <g fill="#aeb8b3" font-size="16">
        <text x="28" y="70">Content</text>
        <text x="28" y="116">Presentation</text>
        <text x="28" y="162">Configuration</text>
        <text x="352" y="70">Additional pages</text>
        <text x="352" y="116">Source images</text>
        <text x="352" y="162">Static assets</text>
      </g>
    </g>

    <path d="M380 326v54" stroke="#d8c47a" stroke-width="8" stroke-linecap="round"/>
    <path d="m350 372 30 38 30-38" fill="none" stroke="#d8c47a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(194 420)">
      <rect width="372" height="116" rx="22" fill="#d8c47a"/>
      <text x="186" y="44" text-anchor="middle" fill="#101417" font-size="34" font-weight="800">Norna</text>
      <text x="186" y="74" text-anchor="middle" fill="#101417" font-size="19" font-weight="700">Opinionated website implementation</text>
      <text x="186" y="99" text-anchor="middle" fill="#101417" font-family="Menlo, Consolas, monospace" font-size="18">site model + renderer</text>
    </g>

    <text x="380" y="574" text-anchor="middle" fill="#f2eee6" font-size="19" font-weight="700">You describe the site; Norna implements the website.</text>

    <path d="M380 592v54" stroke="#d8c47a" stroke-width="8" stroke-linecap="round"/>
    <path d="m350 638 30 38 30-38" fill="none" stroke="#d8c47a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(214 686)">
      <rect width="332" height="82" rx="18" fill="#eef2f0"/>
      <text x="166" y="34" text-anchor="middle" fill="#101417" font-size="27" font-weight="800">dist/</text>
      <text x="166" y="62" text-anchor="middle" fill="#101417" font-size="20" font-weight="700">Static website</text>
    </g>

    <path d="M556 728h72" stroke="#d8c47a" stroke-width="7" stroke-linecap="round"/>
    <path d="m620 704 30 24-30 24" fill="none" stroke="#d8c47a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(584 626)">
      <rect x="68" y="58" width="74" height="88" rx="15" fill="#243039" stroke="#d8c47a" stroke-width="3"/>
      <text x="105" y="88" text-anchor="middle" fill="#f2eee6" font-size="15" font-weight="700">GitHub</text>
      <text x="105" y="108" text-anchor="middle" fill="#f2eee6" font-size="15" font-weight="700">Pages</text>
      <text x="105" y="132" text-anchor="middle" fill="#d8c47a" font-size="13" font-weight="700">Integrated</text>
      <text x="105" y="149" text-anchor="middle" fill="#d8c47a" font-size="13" font-weight="700">today</text>
    </g>

    <path d="M380 770c70 28 126 30 196 12" stroke="#aeb8b3" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 12" fill="none"/>
    <path d="m564 764 34 11-25 27" fill="none" stroke="#aeb8b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(438 738)">
      <rect x="174" y="28" width="114" height="48" rx="12" fill="#182126" stroke="#52626b" stroke-width="2"/>
      <text x="231" y="48" text-anchor="middle" fill="#f2eee6" font-size="13" font-weight="700">Other hosts</text>
      <text x="231" y="66" text-anchor="middle" fill="#aeb8b3" font-size="12">Future only</text>
    </g>
  </g>
</svg>
