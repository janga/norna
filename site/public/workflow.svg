<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
  <title id="title">Norna build and publishing workflow</title>
  <desc id="desc">Norna turns site files describing content, presentation, configuration, routes and assets into a static website in dist. GitHub Pages is the integrated publishing target today, while a dashed branch shows possible future integrations with other static hosts.</desc>
  <rect width="760" height="700" rx="22" fill="#101417"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#d8c47a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#aeb8b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="54" fill="#f2eee6" font-size="23" font-weight="700">Site files</text>
    <text x="48" y="78" fill="#aeb8b3" font-size="14">You describe content, presentation, configuration, routes and assets.</text>

    <g transform="translate(48 104)">
      <rect width="664" height="236" rx="15" fill="#182126" stroke="#52626b"/>

      <g font-size="13" fill="#aeb8b3">
        <text x="28" y="34" font-weight="700" fill="#f2eee6">Content</text>
        <text x="156" y="34" font-family="Menlo, Consolas, monospace" fill="#f2eee6">content.md</text>
        <text x="304" y="34">homepage content and sections</text>

        <text x="28" y="70" font-weight="700" fill="#f2eee6">Presentation</text>
        <text x="156" y="70" font-family="Menlo, Consolas, monospace" fill="#f2eee6">theme.md</text>
        <text x="304" y="70">site-wide visual defaults</text>

        <text x="28" y="106" font-weight="700" fill="#f2eee6">Configuration</text>
        <text x="156" y="106" font-family="Menlo, Consolas, monospace" fill="#f2eee6">config.mjs</text>
        <text x="304" y="106">URL, language and publishing settings</text>

        <text x="28" y="142" font-weight="700" fill="#f2eee6">Images</text>
        <text x="156" y="142" font-family="Menlo, Consolas, monospace" fill="#f2eee6">images/</text>
        <text x="304" y="142">homepage source images by section</text>

        <text x="28" y="178" font-weight="700" fill="#f2eee6">Routes</text>
        <text x="156" y="178" font-family="Menlo, Consolas, monospace" fill="#f2eee6">010-guide/</text>
        <text x="304" y="178">010 orders navigation; guide becomes /guide/</text>
        <text x="156" y="199" font-family="Menlo, Consolas, monospace" fill="#f2eee6">020-concepts/</text>
        <text x="304" y="199">route pages can have their own images</text>

        <text x="28" y="224" font-weight="700" fill="#f2eee6">Public</text>
        <text x="156" y="224" font-family="Menlo, Consolas, monospace" fill="#f2eee6">public/</text>
        <text x="304" y="224">favicon, robots.txt and static assets</text>
      </g>
    </g>

    <path d="M380 356v54" stroke="#d8c47a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(214 428)">
      <rect width="332" height="96" rx="17" fill="#d8c47a"/>
      <text x="166" y="37" text-anchor="middle" fill="#101417" font-size="28" font-weight="800">Norna</text>
      <text x="166" y="62" text-anchor="middle" fill="#101417" font-size="15" font-weight="700">opinionated website implementation</text>
      <text x="166" y="83" text-anchor="middle" fill="#101417" font-family="Menlo, Consolas, monospace" font-size="14">site model + renderer</text>
    </g>

    <text x="380" y="558" text-anchor="middle" fill="#f2eee6" font-size="15" font-weight="700">You describe the site; Norna implements the website.</text>

    <path d="M380 574v42" stroke="#d8c47a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(236 622)">
      <rect width="288" height="58" rx="14" fill="#eef2f0"/>
      <text x="144" y="25" text-anchor="middle" fill="#101417" font-size="23" font-weight="800">dist/</text>
      <text x="144" y="45" text-anchor="middle" fill="#101417" font-size="14" font-weight="700">static website output</text>
    </g>

    <path d="M526 651h74" stroke="#d8c47a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(612 612)">
      <rect width="104" height="78" rx="13" fill="#243039" stroke="#d8c47a" stroke-width="2"/>
      <text x="52" y="28" text-anchor="middle" fill="#f2eee6" font-size="14" font-weight="700">GitHub</text>
      <text x="52" y="47" text-anchor="middle" fill="#f2eee6" font-size="14" font-weight="700">Pages</text>
      <text x="52" y="66" text-anchor="middle" fill="#d8c47a" font-size="12" font-weight="700">integrated today</text>
    </g>

    <path d="M456 668c42 14 84 16 130 2" stroke="#aeb8b3" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9" fill="none" marker-end="url(#arrow-muted)"/>

    <g transform="translate(586 540)">
      <rect width="130" height="56" rx="12" fill="#182126" stroke="#52626b" stroke-width="2"/>
      <text x="65" y="24" text-anchor="middle" fill="#f2eee6" font-size="13" font-weight="700">Other static hosts</text>
      <text x="65" y="43" text-anchor="middle" fill="#aeb8b3" font-size="12">future integrations</text>
    </g>
  </g>
</svg>
