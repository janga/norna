<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Norna site files</title>
  <desc id="desc">The main files and folders in a Norna site directory.</desc>
  <rect width="1200" height="560" rx="28" fill="#111820"/>
  <text x="90" y="82" fill="#f2eee6" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">site/</text>
  <g font-family="Menlo, Consolas, monospace" font-size="26">
    <rect x="90" y="125" width="360" height="56" rx="12" fill="#25323a" stroke="#5f6f78"/>
    <text x="120" y="162" fill="#f2eee6">config.mjs</text>
    <text x="510" y="162" fill="#aaa49a" font-family="Arial, Helvetica, sans-serif" font-size="22">technical settings</text>
    <rect x="90" y="205" width="360" height="56" rx="12" fill="#25323a" stroke="#5f6f78"/>
    <text x="120" y="242" fill="#f2eee6">theme.md</text>
    <text x="510" y="242" fill="#aaa49a" font-family="Arial, Helvetica, sans-serif" font-size="22">site-wide presentation</text>
    <rect x="90" y="285" width="360" height="56" rx="12" fill="#25323a" stroke="#5f6f78"/>
    <text x="120" y="322" fill="#f2eee6">content.md</text>
    <text x="510" y="322" fill="#aaa49a" font-family="Arial, Helvetica, sans-serif" font-size="22">homepage content</text>
    <rect x="90" y="365" width="360" height="56" rx="12" fill="#25323a" stroke="#5f6f78"/>
    <text x="120" y="402" fill="#f2eee6">routes/</text>
    <text x="510" y="402" fill="#aaa49a" font-family="Arial, Helvetica, sans-serif" font-size="22">additional pages</text>
    <rect x="90" y="445" width="360" height="56" rx="12" fill="#25323a" stroke="#5f6f78"/>
    <text x="120" y="482" fill="#f2eee6">images/ + public/</text>
    <text x="510" y="482" fill="#aaa49a" font-family="Arial, Helvetica, sans-serif" font-size="22">media and static files</text>
  </g>
</svg>
