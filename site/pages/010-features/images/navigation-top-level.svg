<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Top-level pages become top navigation</title>
  <desc id="desc">Three sibling page directories pass through automatic navigation and become a horizontal page menu on a wide screen and a compact small-screen menu.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b4a52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .ink { fill: #302a28; }
      .muted { fill: #6b605c; }
      .light { fill: #f8f4ef; }
      .accent { fill: #8b4a52; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 13px; }
      .tree { font-size: 18px; }
      .panel { fill: #fffdf9; stroke: #cbbdb5; stroke-width: 2; }
      .soft { fill: #efe4df; }
      .rule { stroke: #d8ccc5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="638" rx="8" fill="#f4ede8" stroke="#cbbdb5" stroke-width="2"/>
  <g class="sans">
    <rect x="1" y="1" width="378" height="638" rx="8" fill="#242225"/>
    <text class="label" x="30" y="43" fill="#d9b8b5">PAGE FILES</text>
    <g class="mono tree" fill="#f7f0e9">
      <text x="30" y="94">site/pages/</text>
      <text x="30" y="128">├── 000-home/</text>
      <text x="30" y="162">│   └── content.md</text>
      <text x="30" y="196">├── 010-dogs/</text>
      <text x="30" y="230">│   ├── content.md</text>
      <text x="30" y="264">│   └── images/</text>
      <text x="30" y="298">└── 020-adopt/</text>
      <text x="30" y="332">    └── content.md</text>
    </g>
    <rect x="28" y="390" width="322" height="102" rx="6" fill="#302e32" stroke="#4e494f"/>
    <text class="small" x="48" y="423" fill="#beb5b8">Sibling order</text>
    <text class="mono body" x="48" y="461" fill="#ffffff">Home  Dogs  Adopt</text>
    <text class="small" x="30" y="596" fill="#beb5b8">Each page keeps its own URL and content.</text>

    <text class="label accent" x="405" y="252">AUTOMATIC</text>
    <text class="small muted" x="402" y="278">flat page list</text>
    <path d="M404 304 H516" fill="none" stroke="#8b4a52" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="panel" x="548" y="24" width="626" height="372" rx="8"/>
    <rect class="soft" x="549" y="25" width="624" height="46" rx="7"/>
    <circle cx="572" cy="48" r="5" fill="#a96b70"/>
    <circle cx="590" cy="48" r="5" fill="#c49b94"/>
    <rect x="618" y="36" width="530" height="24" rx="4" fill="#fffdf9" stroke="#cbbdb5"/>
    <text class="mono small muted" x="632" y="53">example.test/dogs/</text>
    <text class="label muted" x="568" y="102">WIDE SCREEN</text>
    <line class="rule" x1="568" y1="156" x2="1152" y2="156"/>
    <text class="body ink" x="568" y="137" font-weight="700">DOG SHELTER</text>
    <text class="body muted" x="850" y="137">HOME</text>
    <text class="body accent" x="936" y="137" font-weight="700">DOGS</text>
    <text class="body muted" x="1020" y="137">ADOPT</text>
    <line x1="936" y1="147" x2="984" y2="147" stroke="#8b4a52" stroke-width="2"/>
    <text class="ink" x="568" y="214" font-size="32" font-weight="700">Dogs</text>
    <text class="body ink" x="568" y="256">Meet the dogs currently at the shelter.</text>
    <rect x="568" y="292" width="258" height="76" rx="4" fill="#efe4df"/>
    <rect x="846" y="292" width="258" height="76" rx="4" fill="#e5ece9"/>

    <text class="label muted" x="548" y="435">SMALL SCREEN</text>
    <rect class="panel" x="548" y="454" width="626" height="160" rx="8"/>
    <text class="body ink" x="570" y="490" font-weight="700">Dog Shelter</text>
    <rect x="1032" y="469" width="120" height="34" rx="4" fill="#302a28"/>
    <text class="small light" x="1092" y="491" text-anchor="middle">MENU</text>
    <line class="rule" x1="570" y1="516" x2="1152" y2="516"/>
    <text class="body ink" x="590" y="553">Home</text>
    <text class="body accent" x="750" y="553" font-weight="700">Dogs</text>
    <text class="body ink" x="910" y="553">Adopt</text>
    <text class="small muted" x="590" y="586">The same page list is available from one menu.</text>
  </g>
</svg>
