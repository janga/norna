<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">One page becomes section navigation</title>
  <desc id="desc">A page file tree passes through automatic navigation and becomes H1 and H2 section links on a wide screen and in a compact small-screen menu.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8b4a52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Menlo, Consolas, monospace; }
      .ink { fill: #302a28; }
      .muted { fill: #6b605c; }
      .light { fill: #f8f4ef; }
      .accent { fill: #8b4a52; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 13px; }
      .tree { font-size: 18px; }
      .panel { fill: #fffdf9; stroke: #cbbdb5; stroke-width: 2; }
      .soft { fill: #efe4df; }
      .rule { stroke: #d8ccc5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="638" rx="8" fill="#f4ede8" stroke="#cbbdb5" stroke-width="2"/>
  <g class="sans">
    <rect x="1" y="1" width="378" height="638" rx="8" fill="#242225"/>
    <text class="label" x="30" y="43" fill="#d9b8b5">PAGE FILES</text>
    <g class="mono tree" fill="#f7f0e9">
      <text x="30" y="94">site/pages/</text>
      <text x="30" y="128">└── 000-home/</text>
      <text x="30" y="162">    ├── content.md</text>
      <text x="30" y="196">    └── images/</text>
    </g>
    <rect x="28" y="246" width="322" height="244" rx="6" fill="#302e32" stroke="#4e494f"/>
    <text class="mono small" x="48" y="278" fill="#d9b8b5">content.md</text>
    <text class="mono body" x="48" y="325" fill="#ffffff"># Dog Shelter</text>
    <text class="mono body" x="48" y="370" fill="#ffffff">## What We Do</text>
    <text class="mono body" x="48" y="415" fill="#ffffff">## You Can Help</text>
    <text class="small" x="30" y="596" fill="#beb5b8">The headings are the menu source.</text>

    <text class="label accent" x="405" y="252">AUTOMATIC</text>
    <text class="small muted" x="402" y="278">one listed page</text>
    <path d="M404 304 H516" fill="none" stroke="#8b4a52" stroke-width="2" marker-end="url(#arrow)"/>

    <rect class="panel" x="548" y="24" width="626" height="372" rx="8"/>
    <rect class="soft" x="549" y="25" width="624" height="46" rx="7"/>
    <circle cx="572" cy="48" r="5" fill="#a96b70"/>
    <circle cx="590" cy="48" r="5" fill="#c49b94"/>
    <rect x="618" y="36" width="530" height="24" rx="4" fill="#fffdf9" stroke="#cbbdb5"/>
    <text class="mono small muted" x="632" y="53">example.test/</text>
    <text class="label muted" x="568" y="102">WIDE SCREEN</text>
    <line class="rule" x1="568" y1="156" x2="1152" y2="156"/>
    <text class="body ink" x="568" y="137" font-weight="700">DOG SHELTER</text>
    <text class="body accent" x="760" y="137" font-weight="700">WHAT WE DO</text>
    <text class="body muted" x="945" y="137">YOU CAN HELP</text>
    <line x1="760" y1="147" x2="883" y2="147" stroke="#8b4a52" stroke-width="2"/>
    <text class="ink" x="568" y="214" font-size="32" font-weight="700">What We Do</text>
    <text class="body ink" x="568" y="256">We rescue and rehome dogs.</text>
    <rect x="568" y="292" width="354" height="76" rx="4" fill="#efe4df"/>
    <text class="body muted" x="590" y="326">Page content continues here.</text>
    <text class="small muted" x="590" y="350">H2 links stay close to the page.</text>

    <text class="label muted" x="548" y="435">SMALL SCREEN</text>
    <rect class="panel" x="548" y="454" width="626" height="160" rx="8"/>
    <text class="body ink" x="570" y="490" font-weight="700">Dog Shelter</text>
    <rect x="1032" y="469" width="120" height="34" rx="4" fill="#302a28"/>
    <text class="small light" x="1074" y="491" text-anchor="middle">MENU</text>
    <line class="rule" x1="570" y1="516" x2="1152" y2="516"/>
    <text class="body ink" x="590" y="553">Dog Shelter</text>
    <text class="body accent" x="760" y="553">What We Do</text>
    <text class="body muted" x="930" y="553">You Can Help</text>
    <text class="small muted" x="590" y="586">The same destinations appear in one compact panel.</text>
  </g>
</svg>
