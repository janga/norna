<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc">
<title id="title">Norna — områden, sidor och H2 i en gemensam navigation</title>
<desc id="desc">Reviderad prototypbild i mörkt läge, baserad på dagens integrerade vänstermeny. Sticky-raden innehåller sidlänkar och en separat pil för Reference-menyn. Vänstermenyn är avgränsad till Site model. Site files är aktuell sida; dess H2-rubriker är utfällda. Även Pages and categories är utfälld och visar sina H2-länkar utan att sidan har öppnats. Rubrikerna markeras med indrag och en tunn vertikal linje. Artikeln har små marginalnoter intill berörda stycken. En detalj visar sex likvärdiga referensområden i tre kolumner. Installation från navigationsdemot visar sidans H2-rubriker följda av undersidor under samma utfällning, utan extra grupprubriker. Sidtext följer länken och pilen fäller ut.</desc>
