# Site-wide visual defaults. Remove a value to use the engine default.
layout:
  density: compact
  pageWidth: 1120px
  gutter:
    desktop: clamp(1.25rem, 4vw, 3rem)
    mobile: 1rem
  spacing:
    firstSectionTop:
      desktop: clamp(0.9rem, 1.6vw, 1.5rem)
      mobile: 0.9rem
    sectionGap:
      desktop: clamp(0.8rem, 1.6vw, 1.5rem)
      mobile: 1rem
    finalSectionBottom:
      desktop: clamp(1rem, 2vw, 1.75rem)
      mobile: 1rem
images:
  width: 840px
  maxAvailableWidthPercent:
    desktop: 100
    mobile: 100
  maxAvailableHeightPercent:
    desktop: 70
    mobile: 62
typography:
  fontFamily: "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  profile: reading
  rhythm: compact
palette: dark  # Alternatives: light, paper
sectionSurfaces: [base, soft]
